name: Release

# Builds the plugin for every supported Unreal Engine version and attaches the
# packaged zips to a GitHub release.
#
# Requires a self-hosted Windows runner with the engines installed. Each engine
# build job targets the runner label `ue-<version>` (e.g. `ue-5.8`), and finds
# the engine at the path in the `UE_ROOT_<major>_<minor>` repository variable
# (e.g. UE_ROOT_5_8), falling back to C:\Program Files\Epic Games\UE_<version>.
#
# Trigger: push a tag like `v1.2.0`, or run manually from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version/tag, e.g. v1.2.0 (a draft release is created)'
        required: true
      target_platforms:
        description: 'Semicolon separated UAT target platforms'
        required: false
        default: 'Win64'

permissions:
  contents: write

env:
  PLUGIN_NAME: UnrealFastNoise2
  RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
  TARGET_PLATFORMS: ${{ github.event.inputs.target_platforms || 'Win64' }}

jobs:
  versions:
    name: Read UE versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "matrix=$(jq -c . .github/ue-versions.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    name: Build UE ${{ matrix.ue }}
    runs-on: [self-hosted, windows, 'ue-${{ matrix.ue }}']
    strategy:
      fail-fast: false
      matrix:
        ue: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate engine
        shell: pwsh
        run: |
          $var = 'UE_ROOT_' + '${{ matrix.ue }}'.Replace('.', '_')
          $root = (ConvertFrom-Json '${{ toJSON(vars) }}').$var
          if (-not $root) { $root = "C:\Program Files\Epic Games\UE_${{ matrix.ue }}" }
          if (-not (Test-Path "$root\Engine\Build\BatchFiles\RunUAT.bat")) {
            throw "Unreal Engine ${{ matrix.ue }} not found at $root"
          }
          "UE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stamp plugin descriptor
        shell: pwsh
        run: |
          $path = "$env:PLUGIN_NAME.uplugin"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $version = $env:RELEASE_VERSION -replace '^v', ''
          $json.VersionName = $version
          $json | Add-Member -NotePropertyName EngineVersion -NotePropertyValue '${{ matrix.ue }}.0' -Force
          $json | ConvertTo-Json -Depth 10 | Set-Content $path -Encoding utf8

      - name: Build plugin
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "$env:PLUGIN_NAME"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          & "$env:UE_ROOT\Engine\Build\BatchFiles\RunUAT.bat" BuildPlugin `
            -Plugin="$env:GITHUB_WORKSPACE\$env:PLUGIN_NAME.uplugin" `
            -Package="$out" `
            -TargetPlatforms="$env:TARGET_PLATFORMS" `
            -Rocket
          if ($LASTEXITCODE -ne 0) { throw "BuildPlugin failed ($LASTEXITCODE)" }

      - name: Zip
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "$env:PLUGIN_NAME"
          # Strip build leftovers that shouldn't ship
          Remove-Item "$out\Intermediate" -Recurse -Force -ErrorAction SilentlyContinue
          $zip = "$env:PLUGIN_NAME-$env:RELEASE_VERSION-UE${{ matrix.ue }}.zip"
          Compress-Archive -Path "$out\*" -DestinationPath "$env:GITHUB_WORKSPACE\$zip" -Force
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-ue${{ matrix.ue }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [versions, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-ue*
          merge-multiple: true
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: UnrealFastNoise2 ${{ env.RELEASE_VERSION }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: dist/*.zip
          body: |
            Prebuilt plugin packages, one per supported Unreal Engine version (see .github/ue-versions.json).
            Download the zip matching your engine version and extract it into your project's `Plugins` folder.
