name: Detect new Unreal Engine release

# Weekly check for a new Unreal Engine minor version. When Epic publishes the
# release notes for the next minor after the newest entry in
# .github/ue-versions.json, a PR is opened adding it to the supported list.
# That PR triggers the Build workflow for the new version; once merged, tag a
# release (vX.Y.Z) to publish packages for every supported version.
#
# The runner labelled `ue-<version>` must have the new engine installed for the
# build to succeed (see build.yml). Set the PR_TOKEN secret (a PAT) if you want
# the PR to trigger the Build workflow; PRs made with GITHUB_TOKEN do not.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe for next engine version
        id: probe
        run: |
          latest=$(jq -r 'max_by(split(".")|map(tonumber)) ' .github/ue-versions.json)
          major=${latest%%.*}; minor=${latest##*.}
          next="$major.$((minor+1))"
          url="https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-${major}-$((minor+1))-release-notes"
          code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
          echo "Probed $url -> $code"
          if [ "$code" = "200" ]; then
            echo "next=$next" >> "$GITHUB_OUTPUT"
          fi

      - name: Add version to supported list
        if: steps.probe.outputs.next
        run: |
          jq -c '. + ["${{ steps.probe.outputs.next }}"]' .github/ue-versions.json > tmp.json
          jq . tmp.json > .github/ue-versions.json && rm tmp.json
          sed -i -E 's/(Supported Unreal Engine versions: \*\*)[^*]*(\*\*)/\1'"$(jq -r 'join(", ")' .github/ue-versions.json)"'\2/' README.md

      - name: Open pull request
        if: steps.probe.outputs.next
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PR_TOKEN || github.token }}
          branch: ue-${{ steps.probe.outputs.next }}
          commit-message: Add Unreal Engine ${{ steps.probe.outputs.next }} support
          title: Add Unreal Engine ${{ steps.probe.outputs.next }} support
          body: |
            Unreal Engine ${{ steps.probe.outputs.next }} has been released. This adds it to
            `.github/ue-versions.json`, so Build and Release cover it.

            Before merging: make sure a runner labelled `ue-${{ steps.probe.outputs.next }}` has the engine
            installed, and that the Build check passes. Then tag a release to publish packages.
